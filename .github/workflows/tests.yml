name: Tests
on:
  push:
    branches: [ main, refactor ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '15 2 * * *'  # Run slow tests nightly at 2:15 AM UTC
  workflow_dispatch:  # Allow manual triggering from Actions UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Run linter
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy geoparquet_io/

      - name: Check architecture
        run: uv run lint-imports

      - name: Check CLAUDE.md sections are current
        run: uv run python scripts/doc_sync.py --check

      - name: Check code complexity (informational)
        run: uv run xenon --max-absolute=E --max-modules=D --max-average=C geoparquet_io tests
        continue-on-error: true

      - name: Check for dead code (informational)
        run: uv run vulture
        continue-on-error: true

      - name: Check freshness markers (menard)
        run: uv run menard audit --exit-code
        continue-on-error: true

      - name: Check spelling
        run: uv run codespell

      - name: Validate CLAUDE.md
        run: uv run python scripts/validate_claude_md.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Security scan (bandit)
        run: uv run bandit -r geoparquet_io/ -c pyproject.toml

      - name: Dependency audit
        # CVE-2026-3219: pip tar/ZIP handling (CVSS 4.6). Fix in pip 26.1.
        # Self-expiring ignore: removed automatically when pip 26.1+ available.
        run: |
          PIP_VERSION=$(uv run pip --version | awk '{print $2}' | cut -d. -f1,2)
          if [[ "$(printf '%s\n' "26.1" "$PIP_VERSION" | sort -V | head -n1)" == "26.1" ]]; then
            uv run pip-audit
          else
            uv run pip-audit --ignore-vuln CVE-2026-3219
          fi

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        exclude:
          - os: macos-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.10'
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Pre-install DuckDB extensions
        run: |
          uv run python -c "import duckdb; con = duckdb.connect(); con.execute('INSTALL spatial'); con.execute('INSTALL httpfs'); con.execute('INSTALL h3 FROM community')"

      - name: Install tippecanoe
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y tippecanoe
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install tippecanoe
          fi

      - name: Run fast tests with pytest (parallel)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            # Use loadfile distribution on Windows to reduce DuckDB extension conflicts
            uv run pytest -n 4 --dist=loadfile -m "not slow and not network" -v --tb=short --durations=25 --durations-min=0.5 --cov=geoparquet_io --cov-report=term-missing --cov-report=xml
          elif [ "$RUNNER_OS" == "macOS" ]; then
            uv run pytest -n 3 -m "not slow and not network" -v --tb=short --durations=25 --durations-min=0.5 --cov=geoparquet_io --cov-report=term-missing --cov-report=xml
          else
            uv run pytest -n 4 -m "not slow and not network" -v --tb=short --durations=25 --durations-min=0.5 --cov=geoparquet_io --cov-report=term-missing --cov-report=xml
          fi

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Test example notebooks
        run: |
          uv run pytest --nbmake examples/*.ipynb -v --nbmake-timeout=120 --no-cov

  slow-tests:
    # Slow tests run on merge to main, schedule, and manual dispatch (not on PRs)
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install GDAL (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gdal-bin

      - name: Install GDAL (macOS)
        if: runner.os == 'macOS'
        run: brew install gdal

      # Note: GDAL is not easily installable on Windows via Chocolatey.
      # FileGDB tests will gracefully skip on Windows and run on Linux/macOS.

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Pre-install DuckDB extensions
        run: |
          uv run python -c "import duckdb; con = duckdb.connect(); con.execute('INSTALL spatial'); con.execute('INSTALL httpfs'); con.execute('INSTALL h3 FROM community')"

      - name: Run slow and network tests (parallel)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            # Use loadfile distribution on Windows to reduce DuckDB extension conflicts
            uv run pytest -n 4 --dist=loadfile -m "slow or network" -v --tb=short --durations=25 --durations-min=0.5 --cov=geoparquet_io --cov-report=xml --cov-report=term-missing --cov-fail-under=0
          elif [ "$RUNNER_OS" == "macOS" ]; then
            uv run pytest -n 3 -m "slow or network" -v --tb=short --durations=25 --durations-min=0.5 --cov=geoparquet_io --cov-report=xml --cov-report=term-missing --cov-fail-under=0
          else
            uv run pytest -n 4 -m "slow or network" -v --tb=short --durations=25 --durations-min=0.5 --cov=geoparquet_io --cov-report=xml --cov-report=term-missing --cov-fail-under=0
          fi

      - name: Upload slow test coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: slowtests
          name: codecov-slow
          fail_ci_if_error: false
