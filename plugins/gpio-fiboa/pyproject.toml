[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpio-fiboa"
version = "0.1.0"
description = "fiboa (Field Boundaries for Agriculture) plugin for gpio"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "geoparquet-io>=1.1.0",
    "click>=8.1",
]

[project.entry-points."gpio.plugins"]
fiboa = "gpio_fiboa.cli:fiboa"
